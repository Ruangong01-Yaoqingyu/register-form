<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 页面头部 -->
  <header>
    <h1>用户注册</h1>
  </header>

  <!-- 页面主体 -->
  <main>

    <!-- 注册表单 -->
    <form action="#" method="post" id="registerForm">

      <p>
        <label for="username">用户名：</label>
        <input type="text" id="username" name="username" required>
      </p>

      <p>
        <label for="password">密码：</label>
        <input type="password" id="password" name="password" placeholder="6-16位字符" required>
      </p>

      <p>
        <label for="confirmPassword">确认密码：</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
      </p>

      <p>
        性别：
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">男</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">女</label>
      </p>

      <p>
        <label for="birthday">出生日期：</label>
        <input type="date" id="birthday" name="birthday" placeholder="年/月/日">
      </p>

      <p>
        <label for="email">邮箱：</label>
        <input type="email" id="email" name="email" required>
      </p>

      <p>
        <label for="phone">手机号：</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{11}" placeholder="11位手机号">
      </p>

      <p>
        兴趣爱好：
        <input type="checkbox" id="reading" name="hobby" value="reading">
        <label for="reading">阅读</label>
        <input type="checkbox" id="music" name="hobby" value="music">
        <label for="music">音乐</label>
        <input type="checkbox" id="sports" name="hobby" value="sports">
        <label for="sports">运动</label>
      </p>

      <p>
        <label for="avatar">头像上传：</label>
        <input type="file" id="avatar" name="avatar" accept="image/*" multiple>
      </p>

      <p>
        <label for="city">所在城市：</label>
        <select id="city" name="city">
          <option value="">请选择</option>
          <option value="changde" selected>常德</option>
          <option value="changsha">长沙</option>
          <option value="beijing">北京</option>
        </select>
      </p>

      <p>
        <label for="bio">个人简介：</label><br>
        <textarea id="bio" name="bio" rows="4" cols="50"></textarea>
      </p>

      <p>
        <button type="submit">注册</button>
        <button type="reset">重置</button>
      </p>

    </form>

    <!-- 注册须知表格 -->
    <h2>注册须知</h2>
    <table border="1">
      <thead>
        <tr>
          <th colspan="2">注册须知</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>账号安全</td>
          <td>密码请设置为6-16位字符</td>
        </tr>
        <tr>
          <td rowspan="2">资料填写</td>
          <td>邮箱和手机号需真实有效</td>
        </tr>
        <tr>
          <td>头像支持多张图片上传</td>
        </tr>
      </tbody>
    </table>

    <!-- 注册流程：无序列表 -->
    <h2>注册流程</h2>
    <ul>
      <li>填写基本信息</li>
      <li>设置密码</li>
      <li>提交注册</li>
    </ul>

    <!-- 注册步骤：有序列表 -->
    <h2>注册步骤</h2>
    <ol>
      <li>打开注册页面</li>
      <li>输入用户名和密码</li>
      <li>完善个人资料</li>
      <li>点击注册按钮</li>
    </ol>

    <!-- 常见问题：定义列表 -->
    <h2>常见问题</h2>
    <dl>
      <dt>忘记密码怎么办？</dt>
      <dd>可通过邮箱找回。</dd>
      <dt>手机号可以修改吗？</dt>
      <dd>注册后可在个人中心修改。</dd>
    </dl>

  </main>

  <!-- 页面底部 -->
  <footer>
    <p>&copy; 2026 湖南文理学院芙蓉学院 软工2401 姚青钰</p>
  </footer>

  <!-- JavaScript 监听表单提交并打印数据 -->
  <script>
    const form = document.getElementById('registerForm');

    form.addEventListener('submit', function (event) {
      event.preventDefault(); // 阻止默认提交，方便在 Console 查看

      const formData = new FormData(form);
      const data = {};

      formData.forEach((value, key) => {
        if (data[key]) {
          if (!Array.isArray(data[key])) {
            data[key] = [data[key]];
          }
          data[key].push(value);
        } else {
          data[key] = value;
        }
      });

      console.log('收集到的表单数据：', data);
      alert('注册信息已收集，请按 F12 查看 Console 面板。');
    });
  </script>

</body>
</html>
